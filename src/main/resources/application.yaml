server:
  port: 9991

spring:
  datasource:
    url: jdbc:mysql://localhost:4444/liveshop
    username: liveshop
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace

app:
  frontend-url: "http://localhost:5173"

  jwt:
    secret: "hihello"
    access-exp-seconds: 900 # 15분 accesToken 15분
    refresh-exp-seconds: 1209600  # 14일