server:
  port: 9993

spring:
  datasource:
    url: jdbc:mysql://localhost:4444/liveshop
    username: liveshop
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 5555

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  # OAuth2 로그인 관련
  # 구글은 별도의 인증요청, 토큰 요청, 사용자 조회 URL 을 등록할 필요가 없다.

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 244446887329-m7ecoglqadq6cd0qu43cmrm4hd045ac8.apps.googleusercontent.com
            client-secret: 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
            scope:
              - openid
              - profile
              - email

          naver:
            client-id: Im1OZ4pVGec3r0gpkvmR
            client-secret: kBJ_J9pqlK
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9993/login/oauth2/code/naver"
            scope: [name, email, nickname]

          kakao:
            client-id: 07286f287397c4d9b7046fb1c73a483d
            client-secret: oH5c613EDqh5eJsdTsE7FrwJ7m0ZNvuK
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9993/login/oauth2/code/kakao"
            scope: [profile_nickname]

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # 로그인 인증 요청 주소
            token-uri: https://nid.naver.com/oauth2.0/token # token 요청 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me # 사용자 정보 요청 주소
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize # 로그인 인증 요청 주소
            token-uri: https://kauth.kakao.com/oauth/token # token 요청 주소
            user-info-uri: https://kapi.kakao.com/v2/user/me # 사용자 정보 요청 주소
            user-name-attribute: id

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace
    com.ch.memberservice.member.security: debug
    com.ch.memberservice.member.controller: debug
    com.ch.memberservice.member.jwt.: debug

app:
  frontend-url: "http://localhost:5173"

  jwt:
    # powershell에 [Convert]::ToBase64String((1..64 | ForEach-Object {Get-Random -Maximum 256}))
    secret: "g+3LCwjtNetshzbjx/Z6Ts5jyjwvlcbZzaN3Za9c/Ejd1EVS51jMk7vCfdQ7teU9MKOGYk+IyTn24IweHXAjpw=="
    access-exp-seconds: 900 #15분
    refresh-exp-seconds: 1209600 #14일
    refresh-cookie-path: "/api/auth"
    refresh-cookie-secure: false
    refresh-cookie-samesite: "Lax"